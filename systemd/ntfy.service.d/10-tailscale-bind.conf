[Unit]
# ntfy binds a FIXED Tailscale address (listen-http in /etc/ntfy/server.yml).
# At boot it starts before tailscale0 has that address, fails with
# "bind: cannot assign requested address", and used to burn the default
# 5-restarts-in-10s limit — leaving ntfy dead while the rest of the host
# came up (2026-11-16 reboot).
After=tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
