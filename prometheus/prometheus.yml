# Prometheus scrape config — source of truth for the Pi's metrics stack.
# Installed to /etc/prometheus/prometheus.yml by install.sh (Prom stack
# idea, step 1, 2026-09-02). Loopback-only targets: nothing on this box
# is scraped from the network, and Grafana (step 2) will run locally.
# Both daemons are loopback-bound via systemd drop-ins in this directory.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: ntfy
    static_configs:
      - targets: ["127.0.0.1:9091"]
  # cluster coordinator (cluster-prototype): queue depth, per-worker
  # last-seen seconds, unit/job counters in Prometheus text format at
  # GET /metrics. Bearer-authed like every coordinator route — the token
  # is read at scrape time from /etc/cluster-metrics.token (never
  # inline, never in this repo): the coordinator's own var/token copied
  # root:prometheus 0640. See docs/prometheus.md for the owner's two
  # commands; until both land the target shows DOWN, loudly.
  - job_name: cluster
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/cluster-metrics.token
    static_configs:
      - targets: ["127.0.0.1:8800"]
