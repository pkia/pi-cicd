[Service]
# Serve the console templates (/consoles/cluster.html) from
# /etc/prometheus/consoles, with the template libraries from
# /etc/prometheus/console_libraries (installed by install.sh).
#
# systemd applies this directory's drop-ins lexically and a later
# ExecStart assignment REPLACES an earlier one — it does not merge.
# bind-local.conf sorts before this file, so this line must repeat
# every flag bind-local.conf sets (loopback bind + config path) and
# adds the two console paths. tests/test_prometheus_console.py pins
# that union so the repeat cannot silently drop a flag.
#
# A reload cannot pick up new flags — install.sh try-restarts the unit
# after installing this file. Loopback-only daemon, sub-second gap.
ExecStart=
ExecStart=/usr/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --web.listen-address=127.0.0.1:9090 --web.console.templates=/etc/prometheus/consoles --web.console.libraries=/etc/prometheus/console_libraries $ARGS
