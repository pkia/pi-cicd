[Service]
# Loopback only. --collector.systemd exposes per-unit state
# (node_systemd_unit_state) — the raw material for the "probe health over
# time" graph the devlogs quote (09-02 post, Prom stack idea).
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=127.0.0.1:9100 --collector.systemd $ARGS
