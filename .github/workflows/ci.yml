name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all scripts
        run: |
          fail=0
          for f in new-project project-guard install.sh templates/deploy.sh; do
            bash -n "$f" || fail=1
          done
          [ $fail = 0 ] || exit 1

      - name: Byte-compile loop-heartbeat
        run: python3 -m compileall -q loop-heartbeat

      - name: Run loop-heartbeat tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -v

      - name: ShellCheck (non-fatal, advisory)
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          command -v shellcheck >/dev/null || { echo "shellcheck unavailable"; exit 0; }
          shellcheck new-project project-guard install.sh || true

      - name: Mermaid diagrams render (structure sanity)
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          bad = 0
          for p in pathlib.Path(".").rglob("*.md"):
              text = p.read_text()
              blocks = re.findall(r"```mermaid\n(.*?)```", text, re.S)
              for b in blocks:
                  first = b.strip().splitlines()[0] if b.strip() else ""
                  if not re.match(r"(flowchart|sequenceDiagram|graph|classDiagram|stateDiagram|erDiagram|pie|gantt)\b", first):
                      print(f"{p}: mermaid block does not start with a diagram type: {first!r}")
                      bad += 1
          sys.exit(1 if bad else 0)
          EOF
