name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all scripts
        run: |
          fail=0
          for f in new-project project-guard templates/deploy.sh; do
            bash -n "$f" || fail=1
          done
          [ $fail = 0 ] || exit 1

      - name: ShellCheck (non-fatal, advisory)
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          command -v shellcheck >/dev/null || { echo "shellcheck unavailable"; exit 0; }
          shellcheck new-project project-guard || true
